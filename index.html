<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KosmAI — Universi che si evolvono</title>
<meta name="description" content="Galassie di universi, pianeti abitati da civiltà di agenti AI che si passano la conoscenza di generazione in generazione. Ogni dettaglio è un dato reale.">
<link rel="stylesheet" href="sito/universi.css">
</head>
<body>
<header class="barra-alta">
  <a class="marchio" href="./">KosmAI</a>
  <nav id="briciole" class="briciole" aria-label="Dove sei"></nav>
  <a class="link-esperimento" href="esperimento.html">L'esperimento e i numeri</a>
</header>

<main id="scena" class="scena" aria-live="polite">
  <svg id="cielo" class="cielo" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Spazio profondo"></svg>
  <section id="livello" class="livello"></section>
</main>

<section id="comandi" class="comandi" hidden>
  <button id="play" type="button" aria-label="Riproduci">▶</button>
  <input id="barra" type="range" min="1" max="40" value="1" aria-label="Generazione">
  <output id="gen" for="barra"></output>
</section>

<section id="pannelli" class="pannelli" hidden></section>

<footer class="legenda" id="legenda">
  <span><i class="l-reg"></i>regione accesa: elemento capito</span>
  <span><i class="l-buio"></i>regione buia: valenza diversa da quella vera</span>
  <span><i class="l-luna"></i>luna: prevede l'elemento mai visto</span>
  <span><i class="l-atm"></i>atmosfera: reazioni ereditate</span>
  <span><i class="l-anello"></i>anelli: regola delle reazioni, tabella esatta</span>
  <span><i class="l-oro"></i>anello d'oro: legge scoperta</span>
  <span><i class="l-fermo"></i>grigio: fermo da 5 generazioni</span>
</footer>
<script src="sito/universi.js"></script>
</body>
</html>
